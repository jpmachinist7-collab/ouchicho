<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="おうち帳">
<title>おうち帳 v0.18</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* おうち帳：月ごとの季節色をアクセントに、献立の区分（主菜・副菜・汁物・主食）は決まった色で見分ける */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#1F2A24; --muted:#67716B; --line:#E1E5E0; --chip:#E9EDE8;
  --acc:#3E6A8A; --on-acc:#FFFFFF; --good:#2F7D4F; --bad:#B23A3A; --sat:#3F68B5;
  --r-main:#C8562E; --r-side:#3F8A55; --r-soup:#B98A1C; --r-staple:#4C6FB0;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --fs-xs:11px; --fs-s:13px; --fs-m:15px; --fs-l:17px; --fs-xl:22px;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141816;--surface:#1E2320;--ink:#E7EBE8;--muted:#9AA39E;--line:#2D3430;--chip:#29302C;--good:#5DBB82;--bad:#E07070;--sat:#86A6E6;
    --r-main:#E5835C;--r-side:#6CBF83;--r-soup:#DDB24E;--r-staple:#89A6E3;color-scheme:dark;}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-m)/1.6 var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* アクセント色を文字に使うときの読みやすい色 */
:root{--acc-ink:color-mix(in srgb,var(--acc) 82%,#000)}
@media (prefers-color-scheme: dark){:root{--acc-ink:color-mix(in srgb,var(--acc) 45%,#fff)}}

.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px}
header.top.acc{background:var(--acc);color:var(--on-acc)}
.top-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.top h1{font-size:var(--fs-xl);font-weight:700;margin:0;letter-spacing:.02em}
.appname{font-size:var(--fs-s);font-weight:700;opacity:.9;letter-spacing:.08em}
.ver{font-size:var(--fs-xs);font-weight:400;margin-left:6px;opacity:.75;letter-spacing:0}
.monthlabel{font-size:var(--fs-xl);font-weight:700;text-align:center;flex:1}
.monthlabel small{font-size:var(--fs-s);font-weight:500;opacity:.8;margin-right:4px}

.iconbtn{border:0;background:transparent;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none;color:inherit}
.iconbtn svg{width:22px;height:22px}
.btn{border:0;border-radius:999px;padding:8px 16px;background:var(--acc);color:var(--on-acc);font-size:var(--fs-m);font-weight:700;white-space:nowrap}
.btn.sub{background:color-mix(in srgb,var(--acc) 14%,var(--surface));color:var(--acc-ink)}
.btn.ghost{background:transparent;color:var(--acc-ink);padding:6px 10px}
.btn.danger{background:transparent;color:var(--bad)}
.btn.small{padding:5px 12px;font-size:var(--fs-s)}

/* 見出し：太字＋件数。区分の見出しは色の点つき */
.section-title{display:flex;align-items:center;gap:8px;font-size:var(--fs-m);font-weight:700;color:var(--ink);margin:16px 4px 6px}
.section-title .cnt{font-size:var(--fs-s);font-weight:500;color:var(--muted)}
.section-title .more{margin-left:auto}
.hint{font-size:var(--fs-s);color:var(--muted);margin:10px 4px}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:48px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:transparent;font-size:var(--fs-m);color:inherit}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .name{font-weight:700;line-height:1.4}
.row .sub{font-size:var(--fs-s);line-height:1.4;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list.cols{display:grid;grid-template-columns:minmax(0,1fr)}
@media (min-width:600px){
  .list.cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list.cols .row{border-top:0;border-bottom:1px solid var(--line)}
  .list.cols .row:nth-child(odd){border-right:1px solid var(--line)}
}
.row .chev{color:var(--muted);flex:none;width:18px;height:18px}
.empty-msg{padding:20px 16px;text-align:center;color:var(--muted);font-size:var(--fs-s)}

.badge{display:inline-block;font-size:var(--fs-xs);font-weight:700;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;white-space:nowrap;vertical-align:2px}
.badge.season{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc-ink)}
.badge.cheap{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.badge.high{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.badge.req{background:var(--acc);color:var(--on-acc)}

/* 献立の区分の色 */
.dot{width:8px;height:8px;border-radius:4px;background:var(--rc,var(--muted));flex:none;display:inline-block}
.r-main{--rc:var(--r-main)} .r-side{--rc:var(--r-side)} .r-soup{--rc:var(--r-soup)} .r-staple{--rc:var(--r-staple)}
.role{font-size:var(--fs-xs);font-weight:700;color:var(--rc,var(--muted));width:2.6em;flex:none;display:flex;align-items:center;gap:4px}

.thumb{width:34px;height:34px;border-radius:9px;font-size:var(--fs-s);background:var(--chip);flex:none;display:grid;place-items:center;font-weight:700;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}

/* 献立：今日とリクエストのカード */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:14px}
.card-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.card-head b{font-size:var(--fs-l)}
.card-head span{font-size:var(--fs-s);color:var(--muted)}
.card-head .btn{margin-left:auto;align-self:center}
.today-list{display:flex;flex-direction:column;gap:6px}
.today-item{display:flex;align-items:center;gap:8px;font-weight:700}
.today-item .role{width:auto}
.req-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:var(--fs-m)}
.req-item:first-of-type{border-top:0}
.req-item .who{margin-left:auto;font-size:var(--fs-s);color:var(--muted)}

/* 献立カレンダー */
.shun{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.shun::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:var(--fs-s);padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--acc) 10%,var(--surface));color:var(--acc-ink);font-weight:500}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px}
.cal .wd{background:var(--surface);text-align:center;font-size:var(--fs-xs);font-weight:700;color:var(--muted);padding:6px 0}
.cal .wd.sun{color:var(--bad)} .cal .wd.sat{color:var(--sat)}
.day{background:var(--surface);height:84px;overflow:hidden;padding:4px;border:0;text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:1px;min-width:0;color:inherit}
.day.empty{background:var(--bg)}
.dn{font-size:var(--fs-s);font-weight:700;width:24px;height:24px;display:grid;place-items:center;border-radius:12px}
.day.sun .dn{color:var(--bad)} .day.sat .dn{color:var(--sat)}
.day.today .dn{background:var(--acc);color:var(--on-acc)}
.dish{font-size:var(--fs-xs);line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-left:5px;border-left:3px solid var(--rc,var(--line))}
.dish.more{border-left-color:transparent;color:var(--muted)}
@media (min-width:600px){.day{height:104px;padding:6px}.dish{font-size:var(--fs-s)}}

/* シート */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;height:90%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
.sheet::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 4px 16px}
.sheet-head h2{font-size:var(--fs-xl);margin:0;font-weight:700}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}

/* フォーム */
.field{display:block;margin:14px 0}
.field > .lbl{display:block;font-size:var(--fs-s);font-weight:700;color:var(--muted);margin-bottom:6px}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;appearance:none;-webkit-appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.input{min-height:120px;resize:vertical;line-height:1.6}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:9px;font-size:var(--fs-s);font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);font-weight:700;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:disabled{opacity:.4}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-size:var(--fs-s)}
.months button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:var(--fs-s);white-space:nowrap;flex:none}
.chipbtn.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
/* 絞り込みは1行で横スクロール（縦に場所を取らない） */
.filters{margin:10px -16px 4px;padding:0 16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.photo{width:120px;height:120px;border-radius:16px;background:var(--surface);border:1px dashed var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:var(--fs-s);padding:0}
.photo img{width:100%;height:100%;object-fit:cover}
.photo-row{display:flex;align-items:flex-end;gap:12px}
.linkbtn{border:0;background:transparent;color:var(--bad);font-size:var(--fs-s);padding:4px 0}
.actions{display:flex;gap:8px;margin-top:22px}
.actions .btn{flex:1;padding:11px 16px}
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:2px 14px 14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair .field{margin-bottom:0}

/* マスタのタイル */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;color:inherit}
.tile .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc-ink);margin-bottom:6px}
.tile .ic svg{width:18px;height:18px}
.tile b{font-size:var(--fs-l)}
.tile span{font-size:var(--fs-s);color:var(--muted)}

/* タブバー */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;max-width:760px;margin:0 auto;padding:4px 4px 0}
.tab{flex:1;border:0;background:transparent;padding:4px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.tab .pill{width:52px;height:28px;border-radius:14px;display:grid;place-items:center}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--acc-ink);font-weight:700}
.tab.on .pill{background:color-mix(in srgb,var(--acc) 16%,transparent)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:var(--fs-s);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
.toast.show{opacity:1}

/* ログイン */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.login[hidden]{display:none}
.login .box{width:100%;max-width:360px}
.login h1{font-size:var(--fs-xl);margin:0 0 4px}
.login .err{color:var(--bad);font-size:var(--fs-s);min-height:1.6em;margin-top:8px}

/* 買い物リスト */
.weeklabel{font-size:var(--fs-m);font-weight:700;text-align:center;flex:1}
.check{width:28px;height:28px;border-radius:14px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent;padding:0}
.check svg{width:16px;height:16px}
.check.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.row.done .name{text-decoration:line-through;color:var(--muted);font-weight:500}
.progress{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--acc);border-radius:4px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sum b{font-size:var(--fs-l)}
.sum span{font-size:var(--fs-s);color:var(--muted)}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
@media (min-width:600px){.pickgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pk{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px 8px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-s);font-weight:500;color:inherit;text-align:center;line-height:1.3}
.pk .s{font-size:var(--fs-xs);font-weight:700;color:var(--acc-ink)}
.pk .c{font-size:var(--fs-xs);color:var(--muted)}
.pk.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface));font-weight:700}
.pk.on::after{content:"✓";position:absolute;top:3px;right:7px;font-size:var(--fs-xs);color:var(--acc-ink);font-weight:700}
.pk.new{border-style:dashed;color:var(--acc-ink)}
.sheet-foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0 4px;margin-top:12px;display:flex;align-items:center;gap:10px}
.sheet-foot span{flex:1;font-size:var(--fs-s);color:var(--muted)}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chart .ax{font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .line{fill:none;stroke:var(--acc);stroke-width:2}
.chart .dot{fill:var(--surface);stroke:var(--acc);stroke-width:2}
.chart .avg{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .target{stroke:var(--good);stroke-width:1;stroke-dasharray:4 4}
.chart .tl{font-size:11px;fill:var(--good)}
</style>
</head>
<body>
<div id="app"></div>

<nav class="tabbar" aria-label="画面切り替え"><div class="in" id="tabs"></div></nav>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="backdrop" data-act="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="login" class="login" hidden>
  <div class="box">
    <h1>おうち帳</h1>
    <p class="hint" style="margin:0 0 8px">家族で共有するために、登録したメールアドレスでログインしてください</p>
    <label class="field"><span class="lbl">メールアドレス</span><input class="input" id="lgEmail" type="email" autocomplete="username" inputmode="email"></label>
    <label class="field"><span class="lbl">パスワード</span><input class="input" id="lgPass" type="password" autocomplete="current-password"></label>
    <div class="actions"><button class="btn" data-act="login">ログイン</button></div>
    <div class="err" id="lgErr" role="alert"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>
'use strict';
const VERSION = 'v0.18';
const KEY = 'ouchicho-data';
const WD = ['日','月','火','水','木','金','土'];
// 月ごとの季節色（画面のアクセント色）
const MONTH_COLORS = {1:'#3E6A8A',2:'#5A6FA0',3:'#B05A7A',4:'#B8566F',5:'#3F8A55',6:'#5B6DAE',7:'#2C8297',8:'#A86A14',9:'#9A6A24',10:'#A35428',11:'#8A5A3A',12:'#6A4C78'};

// ---------- 初期データ（一般的な旬。使いながら直していく） ----------
const SEED_FOODS = [
  ['白菜',[11,12,1,2]],['大根',[11,12,1,2]],['キャベツ',[1,2,3,4,5]],['ほうれん草',[11,12,1,2]],['小松菜',[12,1,2]],
  ['春菊',[11,12,1,2]],['長ねぎ',[11,12,1,2]],['ブロッコリー',[11,12,1,2,3]],['れんこん',[11,12,1,2]],['ごぼう',[11,12,1,2]],
  ['里芋',[9,10,11,12]],['さつまいも',[9,10,11]],['かぼちゃ',[7,8,9,10]],['なす',[6,7,8,9]],['トマト',[6,7,8]],
  ['きゅうり',[6,7,8]],['ピーマン',[6,7,8,9]],['ゴーヤ',[7,8]],['オクラ',[7,8,9]],['とうもろこし',[7,8]],
  ['たけのこ',[4,5]],['アスパラガス',[4,5,6]],['生しいたけ',[3,4,10,11]],
  ['玉ねぎ',[]],['にんじん',[]],['じゃがいも',[]],['しめじ',[]],['もやし',[]],['焼きそば麺',[]],
  ['いちご',[1,2,3,4,5]],['みかん',[11,12,1,2]],['りんご',[9,10,11,12,1]],['キウイ',[11,12,1,2,3,4]],['ぶどう',[8,9,10]],['もも',[7,8]],

function seasonText(months){
  if (!months || !months.length || months.length === 12) return '通年';
  const set = new Set(months), runs = [];
  for (let s = 1; s <= 12; s++){
    if (set.has(s) && !set.has(s === 1 ? 12 : s - 1)){
      let e = s, len = 1;
      while (len < 12 && set.has(e === 12 ? 1 : e + 1)){ e = e === 12 ? 1 : e + 1; len++; }
      runs.push(s === e ? `${s}月` : `${s}〜${e}月`);
    }
  }
  return runs.join('、');
}

function menuFromSeed(row, items, categories){
  const [name, catName, teiban, ings] = row;

  ings.forEach(([n, q]) => { const it = items.find(i => i.name === n && i.cat === 'food'); if (it){ itemIds.push(it.id); qty[it.id] = q; } });
  return {id:uid(), name, role:guessRole(name, catName), categoryId:cat ? cat.id : '', teiban, genen:false, itemIds, qty, steps:'', updatedAt:Date.now()};
}
function seed(){
  const items = [];

  SEED_FOODS.forEach(([n,s]) => items.push(newItem(n,'food',s, seedFcatOf(n))));

  const categories = SEED_CATS.map(name => ({id:uid(), name}));
  const menus = SEED_MENUS.map(r => menuFromSeed(r, items, categories));

    const c = {id:db.foodCats.some(x => x.id === id) ? uid() : id, name}, other = db.foodCats.findIndex(x => x.name === 'その他');
    if (other >= 0) db.foodCats.splice(other, 0, c); else db.foodCats.push(c);  // 「その他」より前に入れる
  });

  SEED_FOODS.forEach(([n,s]) => { if (!db.items.some(i => i.name === n && i.cat === 'food')){ db.items.push(newItem(n,'food',s, fcatIdOf(n))); nItems++; } });

function stable(v){
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';

}
// アプリのデータ ⇔ Firestoreの文書（価格1件、献立1日分…ごとに分けて、同時に書いても上書きし合わないようにする）
function toDocs(d){
  const m = {};
  d.items.forEach(x => m['items/' + x.id] = x);
  d.menus.forEach(x => m['menus/' + x.id] = x);
  d.stores.forEach(x => m['stores/' + x.id] = x);
  d.prices.forEach(x => m['prices/' + x.id] = x);
  d.requests.forEach(x => m['requests/' + x.id] = x);
  m['meta/members'] = {map:d.members};
  for (const [k,v] of Object.entries(d.plan)) m['plan/' + k] = {ids:v};
  d.shoplist.forEach(x => m['shoplist/' + x.id] = x);
  m['meta/categories'] = {list:d.categories};
  m['meta/goodsCats'] = {list:d.goodsCats};
  m['meta/foodCats'] = {list:d.foodCats};
  return m;
}
function fromDocs(map){
  const raw = {items:[], menus:[], stores:[], prices:[], requests:[], plan:{}, shopping:{}, categories:[], goodsCats:[], members:{}, settings:db.settings};
  for (const [path, json] of map){
    const [col, id] = path.split('/'), v = JSON.parse(json);
    if (col === 'plan') raw.plan[id] = v.ids;
    else if (col === 'shopping') raw.shopping[id] = v;
    else if (col === 'shoplist'){ (raw.shoplist = raw.shoplist || []).push(v); }
    else if (col === 'meta'){ if (id === 'categories') raw.categories = v.list || []; if (id === 'goodsCats') raw.goodsCats = v.list || []; if (id === 'foodCats') raw.foodCats = v.list || []; if (id === 'members') raw.members = v.map || {}; }
    else if (raw[col]) raw[col].push(v);
  }
  return normalize(raw);
}
function pushChanges(){
  if (!syncReady || !fs || !synced) return;
  const cur = toDocs(db), seen = new Set(), ops = [];
  for (const [p, v] of Object.entries(cur)){
    const j = stable(v); seen.add(p);
    if (synced.get(p) !== j){ ops.push(['set', p, v]); synced.set(p, j); }
  }
  for (const p of [...synced.keys()]) if (!seen.has(p)){ ops.push(['del', p]); synced.delete(p); }
  for (let i = 0; i < ops.length; i += 400){
    const b = fs.batch();
    ops.slice(i, i + 400).forEach(([t, p, v]) => { const ref = fs.doc(HOUSE + '/' + p); if (t === 'set') b.set(ref, JSON.parse(JSON.stringify(v))); else b.delete(ref); });
    pendingWrites++; updateSyncState();
    b.commit().then(() => { pendingWrites--; updateSyncState(); }).catch(e => { pendingWrites--; updateSyncState(); syncError(e); });
  }
}

function startSync(){
  synced = new Map(); syncReady = false; updateSyncState();
  const firstSeen = new Set();
  fs.collection(HOUSE + '/meta').get().then(snap => {
    if (snap.empty){
      // 家族の誰もまだ使っていない：この端末のデータを共有の最初のデータにする
      syncReady = true; pushChanges(); toast('この端末のデータを家族共有に移しました');
    }
    SYNC_COLS.forEach(col => {
      unsubs.push(fs.collection(HOUSE + '/' + col).onSnapshot(qs => {
        qs.docChanges().forEach(ch => {
          const p = col + '/' + ch.doc.id;
          if (ch.type === 'removed') synced.delete(p); else synced.set(p, stable(ch.doc.data()));
        });
        firstSeen.add(col);
        if (firstSeen.size === SYNC_COLS.length){
          syncReady = true;
          db = fromDocs(synced); localSave(); renderFromRemote(); updateSyncState();
          pushChanges(); // 古い版のデータを移行して変わった分があれば共有にも反映
        }
      }, syncError));
    });
  }).catch(syncError);
}

function priceStats(itemId){
  const recs = db.prices.filter(p => p.itemId === itemId).sort((a,b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  if (!recs.length) return {n:0, recs};
  const sum = recs.reduce((s,p) => s + p.price, 0), avg = sum / recs.length;
  const min = Math.min(...recs.map(p => p.price)), latest = recs[0];
  let judge = null;
  if (recs.length >= 2) judge = latest.price <= avg * 0.92 ? '安い' : latest.price >= avg * 1.08 ? '高い' : '普通';
  return {n:recs.length, recs, avg, min, latest, judge};
}
// お買い物の目安：ふだんの値段（平均）、狙い目（平均の92%以下）、店ごとの比較
function itemGuide(itemId){
  const st = priceStats(itemId);
  if (!st.n) return null;
  const by = {};
  st.recs.forEach(p => { (by[p.storeId] = by[p.storeId] || []).push(p.price); });
  const stores = Object.entries(by).map(([storeId, ps]) => ({storeId, avg:ps.reduce((a,b) => a + b, 0) / ps.length, min:Math.min(...ps), n:ps.length}))
    .sort((a,b) => a.avg - b.avg);
  const named = stores.filter(x => x.storeId && storeById(x.storeId));
  return {st, typical:Math.round(st.avg), target:st.n >= 2 ? Math.floor(st.avg * 0.92) : null, stores, best:named.length >= 2 ? named[0] : null, cheapest:named[0] || null};
}

function itemListHtml(cat){
  const q = S.itemQ.trim(), f = S.itemF;
  const list = db.items.filter(i => i.cat === cat && (!q || i.name.includes(q)))
    .filter(i => S.gcatF === 'all' || (S.gcatF === 'none' ? !hasItemCat(i) : i.gcatId === S.gcatF)).filter(i =>
      f === 'season' ? i.season.includes(S.m) :
      f === 'year' ? (!i.season.length || i.season.length === 12) :
      f === 'priced' ? db.prices.some(p => p.itemId === i.id) :
      f === 'nophoto' ? !i.photo : true)
    .sort((a,b) => byJa(a.name,b.name));
  if (!list.length) return `<div class="list"><div class="empty-msg">${q || f !== 'all' || S.gcatF !== 'all' ? '条件に合うものがありません' : 'まだ登録されていません。右上の「追加」から登録できます'}</div></div>`;
  const rowHtml = it => {
    const st = priceStats(it.id), parts = [];
    if (cat === 'food'){ const st2 = seasonText(it.season); parts.push(st2 === '通年' ? '通年' : '旬 ' + st2); }
    if (it.unit) parts.push(esc(it.unit));
    if (storeName(it.favStoreId)) parts.push(esc(storeName(it.favStoreId)));
    if (st.n) parts.push('最新 ' + yen(st.latest.price));
    if (cat === 'goods' && it.memo) parts.push(esc(it.memo));
    return `<button class="row" data-act="item-open" data-id="${it.id}"><span class="thumb">${it.photo ? `<img src="${it.photo}" alt="">` : esc(it.name.slice(0,1))}</span>
      <div class="main"><div class="name">${esc(it.name)}${cat === 'food' && it.season.includes(S.m) ? '<span class="badge season">旬</span>' : ''}${judgeBadge(st.judge)}</div><div class="sub">${parts.join('　') || '&nbsp;'}</div></div></button>`;
  };
  // カテゴリごとに分ける
  return [...itemCats(cat).map(c => [c.name, i => i.gcatId === c.id]), ['未分類', i => !hasItemCat(i)]].map(([name, fn]) => {
    const g = list.filter(fn);
    return g.length ? `<div class="section-title">${esc(name)}<span class="cnt">${g.length}品</span></div><div class="list cols">${g.map(rowHtml).join('')}</div>` : '';
  }).join('');
}
function gcatChoices(cat){
  const list = [['all','すべて'], ...itemCats(cat).map(c => [c.id, c.name])];
  if (db.items.some(i => i.cat === cat && !hasItemCat(i))) list.push(['none','未分類']);
  return list;
}
const subBar = (title, right = '') => `<header class="top"><div class="top-inner"><button class="iconbtn" data-act="master-back" aria-label="マスタに戻る">${ICON.prev}</button><h1 style="flex:1">${title}</h1>${right}</div></header>`;
function viewMaster(){
  const M = S.master;
  if (M === 'menus') return subBar('メニュー', '<button class="btn" data-act="menu-new">追加</button>') + menusBody();
  if (M === 'food' || M === 'goods'){
    return subBar(M === 'food' ? '食材' : '日用品', '<button class="btn" data-act="item-new">追加</button>') +
      `<div class="wrap"><input class="input" type="search" placeholder="名前で探す" value="${esc(S.itemQ)}" data-in="itemQ">
        ${filterChips(gcatChoices(M), S.gcatF, 'gcat-f')}
        ${filterChips(ITEM_FILTERS[M], S.itemF, 'item-f').replace('chips filters', 'chips filters" style="margin-top:0')}
        <div id="itemList">${itemListHtml(M)}</div></div>`;
  }
  if (M === 'cats' || M === 'gcats' || M === 'fcats'){
    const kind = M === 'gcats' ? 'goods' : M === 'fcats' ? 'food' : 'menu';
    const count = c => kind !== 'menu' ? `${kind === 'goods' ? '日用品' : '食材'} ${db.items.filter(i => i.cat === kind && i.gcatId === c.id).length}品` : `メニュー ${db.menus.filter(m => m.categoryId === c.id).length}品`;
    const rows = catList(kind).map(c => `<button class="row" data-act="cat-open" data-kind="${kind}" data-id="${c.id}"><div class="main"><div class="name">${esc(c.name)}</div><div class="sub">${count(c)}</div></div></button>`).join('');
    return subBar(kind === 'goods' ? '日用品のカテゴリ' : kind === 'food' ? '食材のカテゴリ' : 'メニューの種類', `<button class="btn" data-act="cat-new" data-kind="${kind}">追加</button>`) +
      `<div class="wrap"><div class="list">${rows || '<div class="empty-msg">まだありません。右上の「追加」から登録できます</div>'}</div>
       <p class="hint">並び順は、一覧や絞り込みボタンの順番になります</p></div>`;
  }
  if (M === 'stores'){
    const groups = STORE_TYPES.map(([v,l]) => {
      const list = db.stores.filter(t => t.type === v).sort((a,b) => byJa(a.name,b.name));
      return `<div class="section-title">${l}</div><div class="list">${list.length ? list.map(t => `<button class="row" data-act="store-open" data-id="${t.id}"><div class="main"><div class="name">${esc(t.name)}</div>${t.memo ? `<div class="sub">${esc(t.memo)}</div>` : ''}</div></button>`).join('') : '<div class="empty-msg">まだありません</div>'}</div>`;
    }).join('');
    return subBar('お店', '<button class="btn" data-act="store-new" data-from="master">追加</button>') + `<div class="wrap">${groups}</div>`;
  }
  const foods = db.items.filter(i => i.cat === 'food'), goods = db.items.filter(i => i.cat === 'goods');
  const tile = (act, v, icon, name, sub) => `<button class="tile" data-act="${act}" ${v}><span class="ic">${icon}</span><b>${name}</b><span>${sub}</span></button>`;
  const row = (v, name, sub) => `<button class="row" data-act="master-open" data-v="${v}"><div class="main"><div class="name">${name}</div><div class="sub">${sub}</div></div>${chevron()}</button>`;
  return topBar('マスタ') + `<div class="wrap">
    <div class="tiles">
      ${tile('master-open', 'data-v="food"', ICON.items, '食材', `${foods.length}品　今月の旬 ${foods.filter(i => i.season.includes(S.m)).length}`)}
      ${tile('master-open', 'data-v="goods"', ICON.shop, '日用品', `${goods.length}品`)}
      ${tile('master-open', 'data-v="menus"', ICON.menus, 'メニュー', `${db.menus.length}品　定番 ${db.menus.filter(m => m.teiban).length}`)}
      ${tile('master-open', 'data-v="stores"', ICON.prices, 'お店', `${db.stores.length}軒`)}
    </div>
    <div class="section-title">分類</div>
    <div class="list">
      ${row('fcats', '食材のカテゴリ', db.foodCats.map(c => esc(c.name)).join('、') || 'まだありません')}
      ${row('gcats', '日用品のカテゴリ', db.goodsCats.map(c => esc(c.name)).join('、') || 'まだありません')}
      ${row('cats', 'メニューの種類', db.categories.map(c => esc(c.name)).join('、') || 'まだありません')}
    </div></div>`;
}

function viewPrices(){
  // 食材／日用品とカテゴリで、入力する品目の候補と下の一覧の両方を絞る
  const cat = S.pcat, cats = itemCats(cat);
  if (!gcatChoices(cat).some(([v]) => v === S.pgc)) S.pgc = 'all';
  const gcOk = i => S.pgc === 'all' || (S.pgc === 'none' ? !hasItemCat(i) : i.gcatId === S.pgc);
  const pool = db.items.filter(i => i.cat === cat && gcOk(i)).sort((a,b) => byJa(a.name,b.name));
  const opt = list => list.map(i => `<option value="${i.id}" ${i.id === S.pf.item ? 'selected' : ''}>${esc(i.name)}</option>`).join('');
  const options = S.pgc === 'all'
    ? [...cats.map(c => [c.name, pool.filter(i => i.gcatId === c.id)]), ['未分類', pool.filter(i => !hasItemCat(i))]].filter(([, l]) => l.length).map(([n, l]) => `<optgroup label="${esc(n)}">${opt(l)}</optgroup>`).join('')
    : opt(pool);
  const all = pool.map(it => ({it, st:priceStats(it.id)})).filter(x => x.st.n);
  const tracked = all.filter(x => S.pj === 'cheap' ? x.st.judge === '安い' : S.pj === 'high' ? x.st.judge === '高い' : S.pj === 'one' ? x.st.n === 1 : true)
    .sort((a,b) => b.st.latest.date.localeCompare(a.st.latest.date) || b.st.latest.ts - a.st.latest.ts);
  const rows = tracked.map(({it, st}) => `<button class="row" data-act="price-open" data-id="${it.id}"><div class="main">
      <div class="name">${esc(it.name)}${judgeBadge(st.judge)}</div>
      <div class="sub">最新 ${yen(st.latest.price)}（${esc(storeName(st.latest.storeId) || '店未入力')} ${shortDate(st.latest.date)}）　${st.n >= 2 ? `${yen(Math.floor(st.avg * 0.92))}以下なら買い` : `${st.n}件`}</div></div>${chevron()}</button>`).join('');
  const store = S.pf.store != null ? S.pf.store : db.settings.lastStoreId;
  return topBar('価格') + `<div class="wrap">
    ${segHtml([['food','食材'],['goods','日用品']], cat, 'p-cat')}
    ${filterChips(gcatChoices(cat), S.pgc, 'p-gc')}
    <div class="form-card">
      <label class="field"><span class="lbl">品目（${pool.length}品から選ぶ）</span><select class="input" id="pItem" data-ch="pf-item"><option value="">選んでください</option>${options}</select></label>
      <div class="pair">
        <label class="field"><span class="lbl">お店</span><select class="input" id="pStore" data-ch="pf-store">${storeOptions(store, '選ばない')}</select></label>
        <label class="field"><span class="lbl">価格（円）</span><input class="input" id="pPrice" type="number" inputmode="numeric" min="1" placeholder="198" value="${esc(S.pf.price)}" data-in="pf-price"></label>
      </div>
      <div class="actions" style="margin-top:14px"><button class="btn sub" data-act="store-new" data-from="prices">お店を追加</button><button class="btn" data-act="price-add">記録する</button></div>
    </div>
    <div class="section-title">品目ごとの価格<span class="cnt">${tracked.length}品</span></div>
    ${filterChips([['all','すべて'],['cheap','今安い'],['high','今高い'],['one','記録1回だけ']], S.pj, 'p-j').replace('chips filters', 'chips filters" style="margin-top:0')}
    <div class="list cols">${rows || `<div class="empty-msg">${all.length ? '条件に合う品目がありません' : 'この分類の記録はまだありません'}</div>`}</div>
    <p class="hint">同じ品目を2回以上記録すると、平均と比べた「安い・普通・高い」が出て、献立の候補順にも反映されます</p></div>`;
}
function shopRows(){
  return db.shoplist.filter(e => itemById(e.itemId)).map(e => {
    const it = itemById(e.itemId), g = itemGuide(e.itemId);
    const auto = (it.favStoreId && storeById(it.favStoreId)) ? it.favStoreId : (g && g.cheapest ? g.cheapest.storeId : '');
    return {e, it, g, storeId:e.storeId && storeById(e.storeId) ? e.storeId : auto};
  });
}
function viewShop(){
  const rows = shopRows(), todo = rows.filter(r => !r.e.checked), done = rows.filter(r => r.e.checked), edit = S.shopMode;
  const est = todo.filter(r => r.g).reduce((s, r) => s + r.g.typical, 0);
  const rowHtml = r => {
    const sub = [];
    if (r.e.note) sub.push(esc(r.e.note));
    sub.push(r.e.from ? esc(r.e.from) : r.e.by ? `${esc(memberName(r.e.by))}が追加` : '手動で追加');
    if (r.g && !r.e.checked) sub.push(r.g.target ? `${yen(r.g.target)}以下なら買い` : `前回 ${yen(r.g.st.latest.price)}`);
    return `<div class="row ${r.e.checked ? 'done' : ''}">
      ${edit ? `<button class="iconbtn" data-act="shop-del" data-id="${r.e.id}" aria-label="${esc(r.it.name)}を消す" style="color:var(--bad)">${ICON.minus}</button>`
             : `<button class="check ${r.e.checked ? 'on' : ''}" data-act="shop-check" data-id="${r.e.id}" aria-pressed="${r.e.checked}" aria-label="${esc(r.it.name)}を買った">${ICON.check}</button>`}
      <button class="main" data-act="shop-edit" data-id="${r.e.id}" style="border:0;background:transparent;text-align:left;padding:0;color:inherit;font:inherit"><div class="name">${esc(r.it.name)}${r.g && !r.e.checked ? judgeBadge(r.g.st.judge) : ''}</div><div class="sub">${sub.join('　')}</div></button>
      ${edit ? '' : chevron()}</div>`;
  };
  const keys = [...new Set(todo.map(r => r.storeId))].sort((a,b) => (a ? 0 : 1) - (b ? 0 : 1) || byJa(storeName(a), storeName(b)));
  const groups = keys.map(k => {
    const g = todo.filter(r => r.storeId === k).sort((a,b) => byJa(a.it.name, b.it.name));
    return `<div class="section-title">${storeById(k) ? esc(storeName(k)) : 'お店未定'}<span class="cnt">${g.length}品</span></div><div class="list">${g.map(rowHtml).join('')}</div>`;
  }).join('');
  const showDone = S.showDone || edit;
  const doneHtml = done.length ? `<div class="section-title">買ったもの<span class="cnt">${done.length}品</span>${edit ? '' : `<button class="btn ghost small more" data-act="shop-showdone">${S.showDone ? 'たたむ' : 'ひらく'}</button>`}</div>
    ${showDone ? `<div class="list">${done.sort((a,b) => byJa(a.it.name, b.it.name)).map(rowHtml).join('')}</div>` : ''}` : '';
  const pct = rows.length ? Math.round(done.length / rows.length * 100) : 0;
  const tools = edit
    ? (rows.length ? '<button class="btn small danger" data-act="shop-clear">リストを全部消す</button>' : '')
    : '<button class="btn small sub" data-act="shop-plan">献立から材料を入れる</button>' + (done.length ? '<button class="btn small ghost" data-act="shop-tidy">買ったものを片付ける</button>' : '');
  return `<header class="top"><div class="top-inner"><h1>買い物</h1><div style="display:flex;gap:6px">
      ${rows.length ? `<button class="btn ${edit ? '' : 'sub'}" data-act="shop-mode">${edit ? '完了' : '編集'}</button>` : ''}${edit ? '' : '<button class="btn" data-act="shop-add">追加</button>'}</div></div></header>
    <div class="wrap">
      <div class="card">${rows.length ? `<div class="sum"><b>残り ${todo.length}品</b><span>${est ? `目安 約${yen(est)}` : '価格を記録すると合計の目安が出ます'}</span></div>
          <div class="progress"><i style="width:${pct}%"></i></div>`
        : '<div class="empty-msg" style="padding:6px">リストは空です。右上の「追加」や「献立から材料を入れる」で品目を入れられます</div>'}
        <div class="toolrow">${tools}</div></div>
      ${groups}${doneHtml}
      <p class="hint">${edit ? '赤いボタンで1品ずつ消せます。終わったら「完了」' : '品目をタップすると、メモやお店の変更、削除ができます'}</p>
    </div>`;
}

  </div>`;

function render(){
  document.documentElement.style.setProperty('--acc', MONTH_COLORS[S.m]);
  const views = {plan:viewPlan, shop:viewShop, menus:viewMenus, master:viewMaster, prices:viewPrices, settings:viewSettings};
  $('#app').innerHTML = views[S.tab]();
  $('#tabs').innerHTML = TABS.map(([k,l]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}" ${S.tab === k ? 'aria-current="page"' : ''}><span class="pill">${ICON[k]}</span><span>${l}</span></button>`).join('');
}

// ---------- シート ----------
function openSheet(html){ $('#sheet').innerHTML = html; $('#sheetWrap').hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet(){ $('#sheetWrap').hidden = true; $('#sheet').innerHTML = ''; document.body.style.overflow = ''; mdraft = null; idraft = null; sdraft = null; cdraft = null; }
const sheetHead = title => `<div class="sheet-head"><h2>${title}</h2><button class="iconbtn" data-act="close-sheet" aria-label="閉じる">${ICON.close}</button></div>`;

// 日付の献立
function openDay(ds){
  S.day = ds; S.dayQ = '';
  // まだ入っていない区分（主菜→副菜→汁物）から選び始める
  const have = new Set((db.plan[ds] || []).map(menuById).filter(Boolean).map(m => m.role));
  S.dayRole = (['main','side','soup'].find(r => !have.has(r))) || 'all';
  openSheet(sheetHead(fmtDate(ds)) + `<div class="sheet-body">
    <div class="section-title">この日の献立</div><div class="list" id="dayAssigned"></div>
    <div class="section-title">候補（旬と価格で並べています）</div>
    <div id="dayRoles"></div>
    <input class="input" type="search" placeholder="メニューを探す" data-in="dayQ" style="margin-top:10px">
    <div id="dayCats"></div>
    <div class="list" id="dayCands"></div></div>`);
  renderDay();
}
function renderDay(){
  const ds = S.day, ids = db.plan[ds] || [], mon = +ds.slice(5,7), q = S.dayQ.trim();
  const assigned = ids.map((id, idx) => ({mn:menuById(id), idx})).filter(x => x.mn).sort((a,b) => byRole(a.mn, b.mn));
  $('#dayAssigned').innerHTML = assigned.length ? assigned.map(({mn, idx}) =>
      `<div class="row"><span class="role r-${mn.role}"><span class="dot"></span>${roleName(mn.role)}</span><div class="main"><div class="name">${esc(mn.name)}</div><div class="sub">${esc(ingNames(mn))}</div></div><button class="iconbtn" data-act="day-remove" data-idx="${idx}" aria-label="${esc(mn.name)}を外す">${ICON.minus}</button></div>`).join('')
    : '<div class="empty-msg">まだ決まっていません。下の候補をタップして入れてください</div>';
  $('#dayRoles').innerHTML = segHtml([...ROLES, ['all','すべて']], S.dayRole, 'day-role');
  // 献立の候補：「定番」と種類（肉・魚…）で絞れる
  const dayChoices = [['all','すべて'], ['teiban','定番'], ...catChoices().slice(1)];
  if (!dayChoices.some(([v]) => v === S.dayCat)) S.dayCat = 'all';
  $('#dayCats').innerHTML = filterChips(dayChoices, S.dayCat, 'day-cat');
  const reqIds = new Set(openRequests().map(r => r.menuId));
  const list = db.menus.filter(mn => (S.dayRole === 'all' || mn.role === S.dayRole) && (S.dayCat === 'teiban' ? mn.teiban : inCat(mn, S.dayCat)) && (!q || mn.name.includes(q))).map(mn => ({mn, req:reqIds.has(mn.id), ...menuInfo(mn, mon)}))
    .sort((a,b) => (b.req - a.req) || b.score - a.score || byJa(a.mn.name, b.mn.name));
  $('#dayCands').innerHTML = list.length ? list.map(x => `<button class="row" data-act="day-add" data-id="${x.mn.id}"><div class="main"><div class="name">${esc(x.mn.name)}${x.req ? '<span class="badge req">リクエスト</span>' : ''}${badges(x)}</div><div class="sub">${S.dayRole === 'all' ? roleName(x.mn.role) + '　' : ''}${esc(ingNames(x.mn))}</div></div>${ids.includes(x.mn.id) ? '<span class="badge">入れ済み</span>' : ''}</button>`).join('')
    : `<div class="empty-msg">${q || S.dayCat !== 'all' || S.dayRole !== 'all' ? '条件に合うメニューがありません' : 'メニューがありません。メニュー画面から登録できます'}</div>`;
}

// メニュー編集（材料選びは同じシートの中で別の画面に切り替える）
function openMenu(id){
  const src = id ? menuById(id) : null;
  mdraft = {id:src ? src.id : null, name:src ? src.name : '', role:src ? src.role : (S.menuRole !== 'all' ? S.menuRole : 'main'), categoryId:src ? src.categoryId : (S.menuCat !== 'all' && S.menuCat !== 'none' ? S.menuCat : ''),
    teiban:src ? !!src.teiban : false, genen:src ? !!src.genen : false, itemIds:src ? [...src.itemIds] : [], qty:src ? {...src.qty} : {}, steps:src ? src.steps : ''};
  S.picker = false; S.pickQ = ''; S.pickCat = 'freq';
  openSheet('<div id="menuSheet" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>');
  renderMenuSheet();
}

// よく使う食材：登録しているメニューで使われている回数が多い順
function frequentFoods(){
  const n = new Map();
  db.menus.forEach(m => m.itemIds.forEach(id => n.set(id, (n.get(id) || 0) + 1)));
  return db.items.filter(i => i.cat === 'food' && n.get(i.id)).sort((a,b) => n.get(b.id) - n.get(a.id) || byJa(a.name, b.name)).slice(0, 18);
}
function renderPick(){
  // メニュー編集の画面：選んだ材料と分量
  if ($('#chosen')){
    $('#chosen').innerHTML = mdraft.itemIds.length ? mdraft.itemIds.map(id => { const it = itemById(id); if (!it) return '';
        return `<div class="row"><div class="main"><div class="name">${esc(it.name)}</div></div>
          <input class="input" style="width:7.5em;flex:none" data-in="m-qty" data-id="${id}" value="${esc(mdraft.qty[id] || '')}" placeholder="分量" aria-label="${esc(it.name)}の分量">
          <button class="iconbtn" data-act="pick" data-id="${id}" aria-label="${esc(it.name)}を外す">${ICON.minus}</button></div>`; }).join('')
      : '<div class="empty-msg">まだ材料がありません。下のボタンから選べます</div>';
    return;
  }
  // 材料を選ぶ画面：カテゴリで絞って、マス目から選ぶ。検索したときは全部のカテゴリから探す
  if (!$('#pick')) return;
  const q = S.pickQ.trim();
  const cats = [['freq','よく使う'], ...db.foodCats.map(c => [c.id, c.name])];
  if (db.items.some(i => i.cat === 'food' && !hasItemCat(i))) cats.push(['none','未分類']);
  if (!cats.some(([v]) => v === S.pickCat)) S.pickCat = 'freq';
  $('#pickCats').innerHTML = q ? '' : filterChips(cats, S.pickCat, 'pick-cat');
  let foods;
  if (q) foods = db.items.filter(i => i.cat === 'food' && i.name.includes(q)).sort((a,b) => byJa(a.name,b.name));
  else if (S.pickCat === 'freq') foods = frequentFoods();
  else foods = db.items.filter(i => i.cat === 'food' && (S.pickCat === 'none' ? !hasItemCat(i) : i.gcatId === S.pickCat)).sort((a,b) => byJa(a.name,b.name));
  const catName = i => { const c = db.foodCats.find(x => x.id === i.gcatId); return c ? c.name : '未分類'; };
  const canNew = q && !db.items.some(i => i.name === q && i.cat === 'food');
  $('#pick').innerHTML = (foods.length || canNew) ? `<div class="pickgrid">${foods.map(i => { const on = mdraft.itemIds.includes(i.id);
      return `<button class="pk ${on ? 'on' : ''}" data-act="pick" data-id="${i.id}" aria-pressed="${on}">${esc(i.name)}${q ? `<span class="c">${esc(catName(i))}</span>` : i.season.includes(S.m) ? '<span class="s">旬</span>' : ''}</button>`; }).join('')}
      ${canNew ? `<button class="pk new" data-act="pick-new">＋「${esc(q)}」<span class="c">食材に登録して追加</span></button>` : ''}</div>`
    : `<div class="empty-msg">${S.pickCat === 'freq' ? 'まだよく使う食材がありません。カテゴリから選んでください' : 'このカテゴリの食材はまだありません'}</div>`;
  $('#pickCount').textContent = mdraft.itemIds.length ? `選んだ材料 ${mdraft.itemIds.length}品：${mdraft.itemIds.map(id => (itemById(id) || {}).name).filter(Boolean).join('、')}` : 'タップで選ぶ、もう一度タップで外す';
}

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const S2 = 240, c = document.createElement('canvas'); c.width = S2; c.height = S2;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,S2,S2);
        const r = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - r) / 2, (img.height - r) / 2, r, r, 0, 0, S2, S2);
        resolve(c.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject; img.src = fr.result;
    };
    fr.onerror = reject; fr.readAsDataURL(file);
  });
}

function planIngredients(){
  const map = new Map();
  for (let i = 0; i < S.fpDays; i++){
    const ds = addDays(S.fpStart, i), wd = WD[new Date(ds + 'T00:00:00').getDay()];
    (db.plan[ds] || []).map(menuById).filter(Boolean).forEach(mn => mn.itemIds.forEach(id => {
      if (!itemById(id)) return;
      if (!map.has(id)) map.set(id, []);
      map.get(id).push(`${shortDate(ds)}${wd} ${mn.name}${mn.qty && mn.qty[id] ? ' ' + mn.qty[id] : ''}`);
    }));
  }
  return map;
}

  $('#fpDays').innerHTML = segHtml([[3,'3日'],[7,'1週間'],[14,'2週間']].map(([v,l]) => [String(v), l]), String(S.fpDays), 'fp-days');

function priceChart(recs, g){
  const pts = [...recs].sort((a,b) => a.date.localeCompare(b.date) || a.ts - b.ts);
  if (pts.length < 2) return '<p class="hint">2回以上記録すると、値段の推移がグラフで出ます</p>';
  const W = 340, H = 170, L = 46, Rt = 14, T = 14, B = 26;
  const ys = pts.map(p => p.price);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi){ lo = lo * 0.9; hi = hi * 1.1; }
  const pad = (hi - lo) * 0.2; lo = Math.max(0, lo - pad); hi = hi + pad;
  const x = i => L + (W - L - Rt) * i / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const path = pts.map((p,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ');
  const hline = (v, cls) => `<line class="${cls}" x1="${L}" x2="${W - Rt}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="値段の推移">
    <line class="grid" x1="${L}" x2="${W - Rt}" y1="${H - B}" y2="${H - B}"/>
    <text class="ax" x="${L - 6}" y="${y(hi) + 4}" text-anchor="end">${Math.round(hi)}</text>
    <text class="ax" x="${L - 6}" y="${y(lo) + 4}" text-anchor="end">${Math.round(lo)}</text>
    ${hline(g.st.avg, 'avg')}<text class="ax" x="${W - Rt}" y="${y(g.st.avg) - 4}" text-anchor="end">ふだん</text>
    ${g.target ? hline(g.target, 'target') + `<text class="tl" x="${W - Rt}" y="${y(g.target) + 13}" text-anchor="end">買い時</text>` : ''}
    <path class="line" d="${path}"/>
    ${pts.map((p,i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.price).toFixed(1)}" r="3.5"><title>${shortDate(p.date)} ${yen(p.price)} ${esc(storeName(p.storeId))}</title></circle>`).join('')}
    <text class="ax" x="${L}" y="${H - 8}">${shortDate(pts[0].date)}</text>
    <text class="ax" x="${W - Rt}" y="${H - 8}" text-anchor="end">${shortDate(pts[pts.length - 1].date)}</text>
  </svg>`;
}

// 価格履歴
function openPriceHistory(itemId){
  const it = itemById(itemId); if (!it) return;
  S.priceItem = itemId;
  openSheet(sheetHead(esc(it.name)) + '<div class="sheet-body" id="priceHist"></div>');
  renderPriceHistory();
}
function renderPriceHistory(){
  const st = priceStats(S.priceItem);
  if (!st.n){ closeSheet(); render(); return; }
  const g = itemGuide(S.priceItem);
  const storeRows = g.stores.map(x => `<div class="row"><div class="main"><div class="name">${esc(storeName(x.storeId) || '店未入力')}${g.best && g.best.storeId === x.storeId ? '<span class="badge cheap">いちばん安い</span>' : ''}</div><div class="sub">平均 ${yen(Math.round(x.avg))}　最安 ${yen(x.min)}　${x.n}件</div></div></div>`).join('');
  $('#priceHist').innerHTML = `<div class="hint">${g.target ? `ふだん約${yen(g.typical)}。${yen(g.target)}以下なら買い時` : `ふだん約${yen(g.typical)}`}　最安 ${yen(st.min)}　${st.n}件</div>
    ${priceChart(st.recs, g)}
    <div class="section-title">お店ごと</div><div class="list">${storeRows}</div>
    <div class="section-title">記録</div>
    <div class="list">${st.recs.map(p => `<div class="row"><div class="main"><div class="name">${yen(p.price)}</div><div class="sub">${shortDate(p.date)}　${esc(storeName(p.storeId) || '店未入力')}</div></div><button class="iconbtn" data-act="price-del" data-id="${p.id}" aria-label="この記録を消す">${ICON.minus}</button></div>`).join('')}</div>`;
}

// バックアップ
function downloadFile(file){
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function exportData(){
  const t = todayStr().replace(/-/g,'');
  const file = new File([JSON.stringify(db)], `ouchicho-backup-${t}.json`, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'おうち帳バックアップ'}); }
    catch(e){ if (e.name !== 'AbortError') downloadFile(file); }
  } else downloadFile(file);
}

let toastTimer = null;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

// ---------- 操作 ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'tab': S.tab = el.dataset.tab; if (S.tab === 'master') S.master = null; render(); window.scrollTo(0,0); break;
    case 'month': { let m = S.m + Number(el.dataset.d), y = S.y; if (m < 1){ m = 12; y--; } if (m > 12){ m = 1; y++; } S.m = m; S.y = y; render(); break; }
    case 'close-sheet': closeSheet(); break;

    case 'open-day': openDay(el.dataset.date); break;
    case 'day-add': {
      const arr = db.plan[S.day] || (db.plan[S.day] = []);
      if (arr.includes(id)){ toast('もう入っています'); break; }
      arr.push(id);
      const had = db.requests.some(r => r.menuId === id);
      db.requests = db.requests.filter(r => r.menuId !== id);  // 献立に入れたリクエストは完了
      save(); renderDay(); render(); if (had) toast('リクエストを献立に入れました'); break;
    }
    case 'day-remove': {
      const arr = db.plan[S.day] || []; arr.splice(Number(el.dataset.idx), 1);
      if (!arr.length) delete db.plan[S.day];
      save(); renderDay(); render(); break;
    }

    case 'menu-new': openMenu(null); break;
    case 'menu-open': openMenu(id); break;
    case 'pick': {
      const i = mdraft.itemIds.indexOf(id);
      if (i >= 0){ mdraft.itemIds.splice(i, 1); delete mdraft.qty[id]; } else mdraft.itemIds.push(id);
      renderPick(); break;
    }
    case 'pick-open': S.picker = true; S.pickQ = ''; renderMenuSheet(); break;
    case 'pick-done': S.picker = false; renderMenuSheet(); break;
    case 'pick-cat': S.pickCat = el.dataset.v; renderPick(); { const b = $('#pickBody'); if (b) b.scrollTop = 0; } break;
    case 'pick-new': {
      const name = S.pickQ.trim(); if (!name) break;
      const it = newItem(name, 'food', [], S.pickCat !== 'freq' && S.pickCat !== 'none' ? S.pickCat : '');
      db.items.push(it); save(); mdraft.itemIds.push(it.id);
      S.pickQ = ''; $('#pickInput').value = ''; renderPick();
      toast(`「${name}」を食材に登録しました。旬やカテゴリはマスタで設定できます`); break;
    }
    case 'menu-save': {
      const menuData = () => { const qty = {}; mdraft.itemIds.forEach(x => { const q = (mdraft.qty[x] || '').trim(); if (q) qty[x] = q; });
        return {role:mdraft.role, categoryId:mdraft.categoryId, teiban:mdraft.teiban, genen:mdraft.genen, itemIds:mdraft.itemIds, qty, steps:mdraft.steps, updatedAt:Date.now()}; };
      const name = mdraft.name.trim();
      if (!name){ toast('料理名を入れてください'); break; }
      if (db.menus.some(m => m.name === name && m.id !== mdraft.id)){ toast('同じ名前のメニューがあります'); break; }
      if (mdraft.id){ Object.assign(menuById(mdraft.id), {name, ...menuData()}); }
      else db.menus.push({id:uid(), name, ...menuData()});
      save(); closeSheet(); render(); toast('保存しました'); break;
    }
    case 'menu-del': {
      const mn = menuById(mdraft.id);
      if (!mn || !confirm(`「${mn.name}」を削除しますか？\n献立に入っている分も外れます。`)) break;
      db.menus = db.menus.filter(m => m.id !== mn.id);
      for (const k of Object.keys(db.plan)){ db.plan[k] = db.plan[k].filter(x => x !== mn.id); if (!db.plan[k].length) delete db.plan[k]; }
      save(); closeSheet(); render(); toast('削除しました'); break;
    }

    case 'master-open': S.master = el.dataset.v; S.itemQ = ''; S.itemF = 'all'; S.gcatF = 'all'; render(); window.scrollTo(0,0); break;
    case 'master-back': S.master = null; render(); window.scrollTo(0,0); break;
    case 'menu-cat': S.menuCat = el.dataset.v; render(); break;
    case 'day-cat': S.dayCat = el.dataset.v; renderDay(); break;
    case 'm-cat': mdraft.categoryId = mdraft.categoryId === id ? '' : id; renderMenuMeta(); break;
    case 'm-genen': mdraft.genen = el.dataset.v === 'true'; renderMenuMeta(); break;
    case 'cat-new': openCat(null, el.dataset.kind); break;
    case 'cat-open': openCat(id, el.dataset.kind); break;
    case 'cat-save': {
      const name = cdraft.name.trim(), list = catList(cdraft.kind);
      if (!name){ toast('名前を入れてください'); break; }
      if (list.some(c => c.name === name && c.id !== cdraft.id)){ toast('同じ名前があります'); break; }
      if (cdraft.id) list.find(c => c.id === cdraft.id).name = name; else list.push({id:uid(), name});
      save(); closeSheet(); render(); toast('保存しました'); break;
    }
    case 'cat-move': {
      const list = catList(cdraft.kind), c = list.find(x => x.id === cdraft.id), i = list.indexOf(c), j = i + Number(el.dataset.d);
      if (j < 0 || j >= list.length) break;
      list.splice(i, 1); list.splice(j, 0, c); save(); render(); openCat(c.id, cdraft.kind); break;
    }
    case 'cat-del': {
      const kind = cdraft.kind, list = catList(kind), c = list.find(x => x.id === cdraft.id);
      if (!c || !confirm(`「${c.name}」を削除しますか？\n${kind === 'goods' ? 'この日用品' : kind === 'food' ? 'この食材' : 'この種類のメニュー'}は「未分類」になります。`)) break;
      if (kind !== 'menu'){ if (kind === 'goods') db.goodsCats = list.filter(x => x.id !== c.id); else db.foodCats = list.filter(x => x.id !== c.id);
        db.items.forEach(i => { if (i.cat === kind && i.gcatId === c.id) i.gcatId = ''; }); if (S.gcatF === c.id) S.gcatF = 'all'; }
      else { db.categories = list.filter(x => x.id !== c.id); db.menus.forEach(m => { if (m.categoryId === c.id) m.categoryId = ''; }); if (S.menuCat === c.id) S.menuCat = 'all'; }
      save(); closeSheet(); render(); toast('削除しました'); break;
    }
    case 'menu-role': S.menuRole = el.dataset.v; render(); break;
    case 'day-role': S.dayRole = el.dataset.v; renderDay(); break;
    case 'm-role': mdraft.role = el.dataset.v; renderMenuMeta(); break;
    case 'gcat-f': S.gcatF = el.dataset.v; render(); break;
    case 'i-gcat': idraft.gcatId = idraft.gcatId === id ? '' : id; renderItemDraft(); break;
    case 'add-general': {
      if (!confirm('一般的なメニュー・食材・日用品のうち、まだ登録されていないものを追加しますか？')) break;
      const r = addGeneral(); save(); render();
      toast(r.nMenus || r.nItems ? `メニュー${r.nMenus}品、食材・日用品${r.nItems}品を追加しました` : '追加するものはありませんでした'); break;
    }
    case 'menu-f': S.menuF = el.dataset.v; render(); break;
    case 'item-f': S.itemF = el.dataset.v; render(); break;
    case 'item-new': openItem(null); break;
    case 'item-open': openItem(id); break;
    case 'i-month': {
      const m = Number(el.dataset.v), i = idraft.season.indexOf(m);
      if (i >= 0) idraft.season.splice(i, 1); else idraft.season.push(m);
      idraft.season.sort((x,y) => x - y); renderItemDraft(); break;
    }
    case 'photo-pick': $('#photoInput').value = ''; $('#photoInput').click(); break;
    case 'photo-del': idraft.photo = ''; renderItemDraft(); break;
    case 'item-save': {
      const name = idraft.name.trim();
      if (!name){ toast('名前を入れてください'); break; }
      if (db.items.some(i => i.name === name && i.cat === idraft.cat && i.id !== idraft.id)){ toast('同じ名前が登録されています'); break; }
      const data = {name, cat:idraft.cat, gcatId:idraft.gcatId, unit:idraft.unit.trim(), memo:idraft.memo.trim(), season:idraft.cat === 'food' ? idraft.season : [], photo:idraft.photo, favStoreId:idraft.favStoreId, updatedAt:Date.now()};
      if (idraft.id) Object.assign(itemById(idraft.id), data); else db.items.push({id:uid(), ...data});
      if (save()){ closeSheet(); render(); toast('保存しました'); }
      break;
    }
    case 'item-del': {
      const it = itemById(idraft.id);
      if (!it || !confirm(`「${it.name}」を削除しますか？\nメニューの材料と価格記録からも消えます。`)) break;
      db.items = db.items.filter(i => i.id !== it.id);
      db.menus.forEach(m => { m.itemIds = m.itemIds.filter(x => x !== it.id); delete m.qty[it.id]; });
      db.prices = db.prices.filter(p => p.itemId !== it.id);
      save(); closeSheet(); render(); toast('削除しました'); break;
    }

    case 'price-add': {
      const itemId = $('#pItem').value, storeId = $('#pStore').value, price = Number($('#pPrice').value);
      if (!itemId){ toast('品目を選んでください'); break; }
      if (!(price > 0)){ toast('価格を入れてください'); break; }
      db.prices.push({id:uid(), itemId, storeId, price:Math.round(price), date:todayStr(), ts:Date.now()});
      db.settings.lastStoreId = storeId; S.priceItem = null; S.pf = {item:'', store:storeId, price:''};
      save(); render(); toast(`${itemById(itemId).name} ${yen(Math.round(price))}を記録しました`); break;
    }
    case 'price-open': openPriceHistory(id); break;
    case 'p-cat': S.pcat = el.dataset.v; S.pgc = 'all'; render(); break;
    case 'p-gc': S.pgc = el.dataset.v; render(); break;
    case 'p-j': S.pj = el.dataset.v; render(); break;

    case 'm-teiban': mdraft.teiban = el.dataset.v === 'true'; renderMenuMeta(); break;
    case 'store-new': openStore(null, el.dataset.from); break;
    case 'store-open': openStore(id, 'master'); break;
    case 's-type': sdraft.type = el.dataset.v; renderStoreType(); break;
    case 'store-save': {
      const name = sdraft.name.trim();
      if (!name){ toast('店名を入れてください'); break; }
      if (db.stores.some(t => t.name === name && t.id !== sdraft.id)){ toast('同じ名前のお店があります'); break; }
      const data = {name, type:sdraft.type, memo:sdraft.memo.trim(), updatedAt:Date.now()};
      if (sdraft.id) Object.assign(storeById(sdraft.id), data);
      else { const t = {id:uid(), ...data}; db.stores.push(t); if (S.storeFrom === 'prices') db.settings.lastStoreId = t.id; }
      save(); closeSheet(); render(); toast('保存しました'); break;
    }
    case 'store-del': {
      const t = storeById(sdraft.id);
      if (!t || !confirm(`「${t.name}」を削除しますか？\n価格記録は残り、お店は「店未入力」になります。`)) break;
      db.stores = db.stores.filter(x => x.id !== t.id);
      db.prices.forEach(p => { if (p.storeId === t.id) p.storeId = ''; });
      db.items.forEach(i => { if (i.favStoreId === t.id) i.favStoreId = ''; });
      if (db.settings.lastStoreId === t.id) db.settings.lastStoreId = '';
      save(); closeSheet(); render(); toast('削除しました'); break;
    }
    case 'price-del': {
      if (!confirm('この記録を消しますか？')) break;
      db.prices = db.prices.filter(p => p.id !== id); save(); render(); renderPriceHistory(); break;
    }

    case 'shop-check': { const e = db.shoplist.find(x => x.id === id); if (e){ e.checked = !e.checked; save(); render(); } break; }
    case 'shop-add': openShopAdd(); break;
    case 'shop-pick': {
      if (db.shoplist.some(e => e.itemId === id && !e.checked)){ toast('もうリストに入っています'); break; }
      db.shoplist.push({id:uid(), itemId:id, note:'', storeId:'', by:myUid(), from:'', checked:false, ts:Date.now()});
      save(); renderShopPick(); render(); toast(`${itemById(id).name}を追加しました`); break;
    }
    case 'shop-edit': openShopEdit(id); break;
    case 'shop-save': {
      const e = db.shoplist.find(x => x.id === S.shopEdit); if (!e) break;
      e.note = $('#seNote').value.trim(); e.storeId = $('#seStore').value;
      save(); closeSheet(); render(); toast('保存しました'); break;
    }
    case 'shop-del': {
      const e = db.shoplist.find(x => x.id === id); if (!e) break;
      db.shoplist = db.shoplist.filter(x => x.id !== id);
      save(); if ($('#seNote')) closeSheet(); render(); toast(`${(itemById(e.itemId) || {}).name || ''}を削除しました`); break;
    }
    case 'shop-mode': S.shopMode = !S.shopMode; render(); break;
    case 'shop-clear': {
      if (!confirm(`買い物リストの${db.shoplist.length}品を全部消しますか？${fbUser ? '\n家族の画面からも消えます。' : ''}`)) break;
      db.shoplist = []; S.shopMode = false; save(); render(); toast('リストを空にしました'); break;
    }
    case 'shop-tidy': {
      const n = db.shoplist.filter(e => e.checked).length;
      if (!n || !confirm(`買ったもの${n}品をリストから消しますか？`)) break;
      db.shoplist = db.shoplist.filter(e => !e.checked); save(); render(); toast('片付けました'); break;
    }
    case 'shop-plan': openShopPlan(); break;
    case 'fp-days': S.fpDays = Number(el.dataset.v); S.fpSel = null; renderShopPlan(); break;
    case 'fp-toggle': { if (S.fpSel.has(id)) S.fpSel.delete(id); else S.fpSel.add(id); renderShopPlan(); break; }
    case 'fp-add': {
      const map = planIngredients(); let n = 0;
      S.fpSel.forEach(itemId => {
        if (db.shoplist.some(e => e.itemId === itemId && !e.checked)) return;
        db.shoplist.push({id:uid(), itemId, note:'', storeId:'', by:myUid(), from:(map.get(itemId) || []).join('、'), checked:false, ts:Date.now()}); n++;
      });
      save(); closeSheet(); render(); toast(n ? `${n}品をリストに入れました` : 'すでにリストに入っていました'); break;
    }
    case 'shop-showdone': S.showDone = !S.showDone; render(); break;
    case 'req-list': openReqList(); break;
    case 'req-pick': openReqPick(); break;
    case 'req-role': S.reqRole = el.dataset.v; renderReqPick(); break;
    case 'req-add': {
      const mn = menuById(id); if (!mn) break;
      if (db.requests.some(r => r.menuId === id)){ toast(`${mn.name}はもうリクエストされています`); break; }
      db.requests.push({id:uid(), menuId:id, by:myUid(), ts:Date.now()}); save(); render();
      if ($('#reqCands')) renderReqPick(); else closeSheet();
      toast(`${mn.name}をリクエストしました`); break;
    }
    case 'req-del': {
      if (!confirm('このリクエストを取り消しますか？')) break;
      db.requests = db.requests.filter(r => r.id !== id); save(); render(); openReqList(); break;
    }

    case 'login': {
      const email = $('#lgEmail').value.trim(), pass = $('#lgPass').value;
      if (!email || !pass){ $('#lgErr').textContent = 'メールアドレスとパスワードを入れてください'; break; }
      $('#lgErr').textContent = 'ログイン中…';
      auth.signInWithEmailAndPassword(email, pass).then(() => { $('#lgErr').textContent = ''; $('#lgPass').value = ''; })
        .catch(e => { $('#lgErr').textContent = e.code === 'auth/network-request-failed' ? '通信できません。電波のある場所でもう一度試してください' : e.code === 'auth/too-many-requests' ? '何度も失敗したので、少し時間をおいてから試してください' : 'メールアドレスかパスワードが違います'; });
      break;
    }
    case 'logout': {
      if (!confirm('ログアウトしますか？\n次に開いたときにもう一度ログインが必要です。')) break;
      auth.signOut(); break;
    }
    case 'export': exportData(); break;
    case 'import': $('#importInput').value = ''; $('#importInput').click(); break;
    case 'reset': {
      if (!confirm(`登録した内容をすべて消して、初期データに戻しますか？${fbUser ? '\n家族の画面のデータも消えます。' : ''}\n先にバックアップを書き出しておくと安心です。`)) break;
      db = seed(); save(); render(); toast('初期データに戻しました'); break;
    }
  }
});

document.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k) return;
  const v = e.target.value;
  if (k === 'dayQ'){ S.dayQ = v; renderDay(); }
  else if (k === 'menuQ'){ S.menuQ = v; $('#menuList').innerHTML = menuListHtml(); }
  else if (k === 'itemQ'){ S.itemQ = v; $('#itemList').innerHTML = itemListHtml(S.master); }
  else if (k === 'shopQ'){ S.shopQ = v; renderShopPick(); }
  else if (k === 'reqQ'){ S.reqQ = v; renderReqPick(); }
  else if (k === 'pf-price') S.pf.price = v;
  else if (k === 'pickQ'){ S.pickQ = v; renderPick(); }
  else if (k === 'm-name') mdraft.name = v;
  else if (k === 'm-steps') mdraft.steps = v;
  else if (k === 'i-name') idraft.name = v;
  else if (k === 'i-unit') idraft.unit = v;
  else if (k === 'i-memo') idraft.memo = v;
  else if (k === 'c-name') cdraft.name = v;
  else if (k === 'm-qty') mdraft.qty[e.target.dataset.id] = v;
  else if (k === 's-name') sdraft.name = v;
  else if (k === 's-memo') sdraft.memo = v;
});

document.addEventListener('change', e => {
  if (e.target.dataset.ch === 'i-store' && idraft) idraft.favStoreId = e.target.value;
  if (e.target.dataset.ch === 'fp-start' && e.target.value){ S.fpStart = e.target.value; S.fpSel = null; renderShopPlan(); }
  if (e.target.dataset.ch === 'pf-item') S.pf.item = e.target.value;
  if (e.target.dataset.ch === 'pf-store') S.pf.store = e.target.value;
  if (e.target.dataset.ch === 'my-name'){ const v = e.target.value.trim(); if (v) db.members[myUid()] = v; else delete db.members[myUid()]; save(); toast('名前を保存しました'); }
  if (e.target.dataset.ch === 'req-date'){
    const r = db.requests.find(x => x.id === e.target.dataset.id), ds = e.target.value;
    if (!r || !ds) return;
    const arr = db.plan[ds] || (db.plan[ds] = []);
    if (!arr.includes(r.menuId)) arr.push(r.menuId);
    const name = menuById(r.menuId).name;
    db.requests = db.requests.filter(x => x.menuId !== r.menuId);
    save(); render(); openReqList(); toast(`${name}を${fmtDate(ds)}の献立に入れました`);
  }
});

$('#photoInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f || !idraft) return;
  try { idraft.photo = await resizeImage(f); renderItemDraft(); }
  catch(err){ toast('写真を読み込めませんでした。別の写真で試してください'); }
});

$('#importInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      if (!obj || !Array.isArray(obj.items) || !Array.isArray(obj.menus)) throw new Error('format');
      if (!confirm(`今のデータを、このバックアップの内容に置き換えますか？${fbUser ? '\n家族の画面のデータも置き換わります。' : ''}`)) return;
      db = normalize(obj); save(); render(); toast('バックアップを読み込みました');
    } catch(err){ toast('おうち帳のバックアップファイルではないようです'); }
  };
  fr.readAsText(f);
});

render();
initFirebase();
</script>
